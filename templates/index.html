<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnappBot Control</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>SnappBot Control Center</h1>
        <div id="status-text" class="status-badge status-stopped">Stopped</div>
    </header>

    <main>
        <div class="controls-section">
            <div class="controls">
                <button id="start-btn">Start Bot</button>
            </div>

            <div id="input-area" class="input-area">
                <div class="input-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span id="input-prompt">Bot needs input:</span>
                </div>
                <div class="input-group">
                    <input type="text" id="user-input" placeholder="Type your response here..." autocomplete="off">
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>

        <div class="log-section">
            <div class="log-header">
                <span>System Logs</span>
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; text-transform: none; font-size: 0.8rem;">
                    <input type="checkbox" id="auto-scroll" checked> Auto-scroll
                </label>
            </div>
            <div id="log-container" class="log-container">
                <!-- Logs will appear here -->
            </div>
        </div>
    </main>

    <script src="/static/js/main.js"></script>
</body>
</html>
